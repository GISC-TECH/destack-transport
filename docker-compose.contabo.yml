services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine@sha256:67f624a4ad70edba8d65c82341124fab7054b277b4f7dea4b04be6f939ce2314
    container_name: destack_postgres
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 2g
    cpus: "2.0"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destack_db}
      POSTGRES_USER: ${POSTGRES_USER:-destack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destack_user} -d ${POSTGRES_DB:-destack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # Redis Cache
  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    container_name: destack_redis
    restart: unless-stopped
    pids_limit: 64
    mem_limit: 512m
    cpus: "1.0"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # MinIO — Object Storage S3-compatible
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: destack_minio
    hostname: destack_minio
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - destack_network
      - traefik-proxy
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # API S3 (porta 9000)
      - "traefik.http.routers.destack-minio.rule=Host(`media.destacktransporte.com`)"
      - "traefik.http.routers.destack-minio.entrypoints=websecure"
      - "traefik.http.routers.destack-minio.tls=true"
      - "traefik.http.routers.destack-minio.tls.certresolver=letsencrypt"
      - "traefik.http.routers.destack-minio.service=destack-minio"
      - "traefik.http.services.destack-minio.loadbalancer.server.port=9000"

  minio_init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: destack_minio_init
    restart: "no"
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.5"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    entrypoint: ["/bin/sh", "/scripts/init-minio.sh"]
    environment:
      - MC_CONFIG_DIR=/tmp/.mc
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:?set MINIO_BUCKET_NAME in .env}
    volumes:
      - ./scripts/init-minio.sh:/scripts/init-minio.sh:ro
    networks:
      - destack_network
    depends_on:
      minio:
        condition: service_healthy

  # Django Application (Backend API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_web
    hostname: destack
    networks:
      destack_network:
        aliases:
          - destack
    env_file:
      - .env
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DEBUG=False
      - RUN_STARTUP_MAINTENANCE=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-destack,destacktransporte.com,www.destacktransporte.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - EVOLUTION_API_URL=http://destack_evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-destack}
      - MEDIA_ROOT=/app/media
      - STATIC_ROOT=/app/staticfiles
      - USE_MINIO=${USE_MINIO:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:?set MINIO_BUCKET_NAME in .env}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL in .env}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
      - ./backups/daily:/app/backups/daily
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully

  # Frontend React (Nginx serving built files + proxy /api to backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: destack_frontend
    restart: unless-stopped
    init: true
    user: "101:101"
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=128m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles:ro
    networks:
      - destack_network
      - traefik-proxy
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      # HTTPS router
      - "traefik.http.routers.destack-frontend.rule=Host(`destacktransporte.com`) || Host(`www.destacktransporte.com`)"
      - "traefik.http.routers.destack-frontend.entrypoints=websecure"
      - "traefik.http.routers.destack-frontend.tls=true"
      - "traefik.http.routers.destack-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.destack-frontend.loadbalancer.server.port=8000"
      # HTTP router (para testes/Cloudflare Flexible; alta prioridade evita redirect global)
      - "traefik.http.routers.destack-frontend-http.rule=Host(`destacktransporte.com`) || Host(`www.destacktransporte.com`)"
      - "traefik.http.routers.destack-frontend-http.entrypoints=web"
      - "traefik.http.routers.destack-frontend-http.priority=100"
      - "traefik.http.routers.destack-frontend-http.service=destack-frontend"
      # Redirect www to apex (optional; keep both if desired)
      # - "traefik.http.routers.destack-frontend-www.rule=Host(`www.destacktransporte.com`)"
      # - "traefik.http.routers.destack-frontend-www.entrypoints=websecure"
      # - "traefik.http.routers.destack-frontend-www.tls=true"
      # - "traefik.http.routers.destack-frontend-www.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.destack-frontend-www.middlewares=www-to-apex"
      # - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\\.(.*)"
      # - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}"

  # Celery Worker (para tarefas assincronas)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_worker
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      - DEBUG=False
      - RUN_STARTUP_MAINTENANCE=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-destack,destacktransporte.com,www.destacktransporte.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - EVOLUTION_API_URL=http://destack_evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-destack}
      - USE_MINIO=${USE_MINIO:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:?set MINIO_BUCKET_NAME in .env}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL in .env}
    volumes:
      - ./logs:/app/logs
      - ./backups/daily:/app/backups/daily
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # Celery Beat (agendador de tarefas)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_beat
    restart: unless-stopped
    init: true
    pids_limit: 64
    mem_limit: 512m
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: celery -A core beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      - DEBUG=False
      - RUN_STARTUP_MAINTENANCE=false
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-destack,destacktransporte.com,www.destacktransporte.com}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destacktransporte.com,https://www.destacktransporte.com}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      - EVOLUTION_API_URL=http://destack_evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-destack}
      - USE_MINIO=${USE_MINIO:-true}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:?set MINIO_BUCKET_NAME in .env}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL:-http://minio:9000}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL in .env}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network
    healthcheck:
      test: ["CMD-SHELL", "pidof -x celery >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # --- SERVICOS OPCIONAIS ---
  # Descomente as secoes abaixo quando quiser habilitar.
  # Evolution API - Gateway de WhatsApp self-hosted
  # evolution_api:
  #   image: evoapicloud/evolution-api:latest
  #   container_name: destack_evolution_api
  #   restart: "no"
  #   expose:
  #     - "8080"
  #   environment:
  #     - SERVER_URL=${EVOLUTION_SERVER_URL:-https://api.destacktransporte.com}
  #     - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
  #     - DATABASE_ENABLED=true
  #     - DATABASE_PROVIDER=${EVOLUTION_DATABASE_PROVIDER:-postgresql}
  #     - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URI:?set EVOLUTION_DATABASE_URI in .env}
  #     - DATABASE_SAVE_DATA_INSTANCE=true
  #     - DATABASE_SAVE_LOGS=true
  #     - WEBHOOK_GLOBAL_ENABLED=false
  #     - REDIS_ENABLED=true
  #     - REDIS_HOST=${REDIS_HOST:-destack_redis}
  #     - REDIS_PORT=${REDIS_PORT:-6379}
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  #     - REDIS_DB=${REDIS_DB:-1}
  #     - CACHE_REDIS_URI=redis://default:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/${REDIS_DB:-1}
  #   volumes:
  #     - evolution_api_data:/evolution/instances
  #     - evolution_api_db:/evolution/db
  #   networks:
  #     - destack_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     start_period: 60s
  #     retries: 5

  # Tor + Privoxy: SOCKS :9050 e HTTP :8118 (Chrome deve usar HTTP)
  tor:
    profiles: ["contabo-tor"]
    build:
      context: ./scraper
      dockerfile: Dockerfile.tor
    container_name: destack_tor
    restart: unless-stopped
    expose:
      - "9050"
      - "8118"
    networks:
      - destack_network

  # EGS XML Collector - Robot para coleta automatica de XMLs
  scraper:
    profiles: ["contabo-scraper"]
    build:
      context: ./scraper
      dockerfile: Dockerfile.warp
    container_name: destack_scraper
    restart: unless-stopped
    # docker-init (tini) recolhe processos Chrome orfaos ao fim de cada job.
    init: true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    shm_size: 512m
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # EGS Sistemas
      - EGS_BASE_URL=https://app.egssistemas.com.br
      - EGS_LOGIN_URL=https://app.egssistemas.com.br/login
      - EGS_USERNAME=${EGS_USERNAME:-DESTACK}
      - EGS_PASSWORD=${EGS_PASSWORD:?set EGS_PASSWORD in .env}
      - EGS_ACCESS_KEY=${EGS_ACCESS_KEY:?set EGS_ACCESS_KEY in .env}
      # Destack API
      - DESTACK_API_URL=${DESTACK_API_URL:-http://destack:8000/api}
      - DESTACK_USERNAME=${DESTACK_USERNAME:-admin}
      - DESTACK_PASSWORD=${DESTACK_PASSWORD:?set DESTACK_PASSWORD in .env}
      # Collector
      - COLLECT_INTERVAL_MINUTES=60
      - DAYS_LOOKBACK=7
      - LOG_LEVEL=INFO
      - SELENIUM_HEADLESS=true
      # Saída brasileira entregue por túnel SSH reverso no gateway Docker.
      # O EGS rejeita o IP estrangeiro da Contabo e saídas WARP/Tor não-BR.
      - CHROME_PROXY_URL=${SCRAPER_CHROME_PROXY_URL:-http://172.23.0.1:18118}
      - TOR_HTTP_PROXY=${SCRAPER_CHROME_PROXY_URL:-http://172.23.0.1:18118}
      - PAGE_LOAD_TIMEOUT=180
      - SELENIUM_TIMEOUT=45
    volumes:
      - scraper_data:/app/data
      - scraper_logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pgrep -f '[p]ython scheduler.py' >/dev/null
          && test ! -f /app/data/last_job_failed
          && test -f /app/data/last_success
          && test $$(($$(date +%s) - $$(stat -c %Y /app/data/last_success))) -lt 28800
          && test "$$(curl -fsS --max-time 20 -x "$${CHROME_PROXY_URL}" https://ipinfo.io/country | tr -d '\r\n')" = "BR"
      interval: 5m
      timeout: 30s
      start_period: 15m
      retries: 2
    depends_on:
      web:
        condition: service_started
    networks:
      - destack_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  minio_data:
    driver: local
  scraper_data:
    driver: local
  scraper_logs:
    driver: local
  evolution_api_data:
    driver: local
  evolution_api_db:
    driver: local

networks:
  destack_network:
    driver: bridge
  traefik-proxy:
    external: true
