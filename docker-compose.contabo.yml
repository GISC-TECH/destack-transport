volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  scraper_data:
    driver: local
  scraper_logs:
    driver: local
  evolution_api_data:
    driver: local
  evolution_api_db:
    driver: local

networks:
  destack_network:
    driver: bridge
  traefik-proxy:
    external: true
