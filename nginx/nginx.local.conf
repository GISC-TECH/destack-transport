user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Resolver DNS do Docker com cache curto para tolerar reinícios de containers.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy API requests to Django
        location /api/ {
            set $upstream_web web;
            proxy_pass http://$upstream_web:8000;
            # Host 'web' é reconhecido pelo Django (ALLOWED_HOSTS) e evita
            # erros quando o Vite proxy acessa o nginx por IP.
            proxy_set_header Host web;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy admin requests to Django
        location /admin/ {
            set $upstream_web web;
            proxy_pass http://$upstream_web:8000;
            proxy_set_header Host web;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve media files from Django
        location /media/ {
            set $upstream_web web;
            proxy_pass http://$upstream_web:8000;
            proxy_set_header Host web;
        }

        # Serve static files from Django
        location /static/ {
            set $upstream_web web;
            proxy_pass http://$upstream_web:8000;
            proxy_set_header Host web;
        }

        # Frontend SPA via Vite dev server
        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
