services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: destack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destack_db}
      POSTGRES_USER: ${POSTGRES_USER:-destack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destack_prod_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - apps_postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destack_user} -d ${POSTGRES_DB:-destack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: destack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_default_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_default_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # Django Application (Backend API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_web
    hostname: destack
    networks:
      destack_network:
        aliases:
          - destack
      apps_frontend:
        aliases:
          - destack
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,destack.gisc.tech}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destack.gisc.tech}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destack.gisc.tech}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend React (Nginx serving built files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: destack_frontend
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      destack_network:
        aliases:
          - destack-frontend
      apps_frontend:
        aliases:
          - destack-frontend
    depends_on:
      - web

  # Evolution API - Gateway de WhatsApp self-hosted
  evolution_api:
    image: evoapicloud/evolution-api:v2.2.2
    container_name: destack_evolution_api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-https://evolution.destacktransporte.site}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=${EVOLUTION_DATABASE_PROVIDER:-sqlite}
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URI:-file:./evolution-api.db}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_LOGS=true
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_api_data:/evolution/instances
      - evolution_api_db:/evolution/db
    networks:
      - destack_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # EGS XML Collector - Robot para coleta automatica de XMLs
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: destack_scraper
    restart: unless-stopped
    environment:
      # EGS Sistemas
      - EGS_BASE_URL=https://app.egssistemas.com.br
      - EGS_LOGIN_URL=https://app.egssistemas.com.br/login
      - EGS_USERNAME=${EGS_USERNAME:-DESTACK}
      - EGS_PASSWORD=${EGS_PASSWORD:?set EGS_PASSWORD in .env}
      - EGS_ACCESS_KEY=${EGS_ACCESS_KEY:?set EGS_ACCESS_KEY in .env}
      # Destack API (produção: destack_app na rede apps_backend)
      - DESTACK_API_URL=${DESTACK_API_URL:-http://destack:8000/api}
      - DESTACK_USERNAME=${DESTACK_USERNAME:-admin}
      - DESTACK_PASSWORD=${DESTACK_PASSWORD:?set DESTACK_PASSWORD in .env}
      # Collector
      - COLLECT_INTERVAL_MINUTES=60
      - DAYS_LOOKBACK=7
      - LOG_LEVEL=INFO
      - SELENIUM_HEADLESS=true
    volumes:
      - scraper_data:/app/data
      - scraper_logs:/app/logs
    depends_on:
      - web
    networks:
      - destack_network
      - apps_backend

  # Celery Worker (para tarefas assincronas)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,destack.gisc.tech}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destack.gisc.tech}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destack.gisc.tech}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A core inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # Celery Beat (agendador de tarefas)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,destack.gisc.tech}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://destack.gisc.tech}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destack.gisc.tech}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/15
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_default_password}@redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network
    healthcheck:
      test: ["CMD-SHELL", "pidof -x celery >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

volumes:
  apps_postgres_data:
    external: true
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  scraper_data:
    driver: local
  scraper_logs:
    driver: local
  evolution_api_data:
    driver: local
  evolution_api_db:
    driver: local

networks:
  destack_network:
    driver: bridge
  apps_backend:
    external: true
  apps_frontend:
    external: true
