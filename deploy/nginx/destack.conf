# DESTACK - Django Backend + React Frontend
# Porta 8001: Backend API (Django)
# Porta 8002: Frontend (React)
# Dominio destacktransporte.site: Frontend via HTTPS + API

# DESENVOLVIMENTO - Backend na porta 8001
server {
    listen 8001;
    server_name _;

    limit_req zone=api burst=20 nodelay;

    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://destack_backend;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://destack_backend/health/;
        proxy_set_header Host localhost;
        access_log off;
    }
}

# DESENVOLVIMENTO - Frontend na porta 8002
server {
    listen 8002;
    server_name _;

    location / {
        proxy_pass http://destack_frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://destack_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# PRODUCAO - Redirect HTTP to HTTPS
server {
    listen 80;
    server_name destacktransporte.site www.destacktransporte.site;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# PRODUCAO - HTTPS (Frontend + API)
server {
    listen 443 ssl;
    http2 on;
    server_name destacktransporte.site www.destacktransporte.site;

    ssl_certificate /etc/letsencrypt/live/destacktransporte.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/destacktransporte.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    limit_req zone=api burst=20 nodelay;

    # Frontend React (raiz)
    location / {
        proxy_pass http://destack_frontend_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Backend Django
    location /api/ {
        proxy_pass http://destack_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Admin Django
    location /admin/ {
        proxy_pass http://destack_backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Static files
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check
    location /health/ {
        proxy_pass http://destack_backend/health/;
        proxy_set_header Host $host;
        access_log off;
    }
}
