<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="486" viewBox="0 0 1280 486" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Destack Transporte</title>
  <desc id="desc">Logo Destack Transporte com símbolo verde, nome principal preto e transporte menor abaixo.</desc>
  <defs>
