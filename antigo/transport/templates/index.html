<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destack Transportes - Redirecionando...</title>
    <script>
        // Detecta o ambiente automaticamente
        var frontendUrl;
        var host = window.location.hostname;
        var protocol = window.location.protocol;

        if (host === 'localhost' || host === '127.0.0.1') {
            // Desenvolvimento local - frontend na porta 8002
            frontendUrl = 'http://localhost:8002/';
        } else if (host === 'destacktransporte.site' || host === 'www.destacktransporte.site') {
            // Producao - mesmo dominio (nginx serve frontend e API)
            frontendUrl = protocol + '//' + host + '/';
        } else {
            // Outros ambientes (IP direto, outros dominios)
            frontendUrl = protocol + '//' + host + ':8002/';
        }

        // Redireciona apenas se estamos na pagina raiz do backend
        if (window.location.pathname === '/' || window.location.pathname === '') {
            window.location.href = frontendUrl;
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #2A5C6B 0%, #3d7a8c 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            margin-bottom: 1rem;
        }
        p {
            opacity: 0.8;
        }
        a {
            color: #FF6B35;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Destack Transportes</h1>
        <p>Redirecionando para o sistema...</p>
        <p>Se nao for redirecionado automaticamente, <a href="#" onclick="window.location.href=frontendUrl; return false;">clique aqui</a>.</p>
    </div>
</body>
</html>
