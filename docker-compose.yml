services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: destack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destack_db}
      POSTGRES_USER: ${POSTGRES_USER:-destack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destack_prod_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destack_user} -d ${POSTGRES_DB:-destack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: destack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_network

  # Django Application (Backend API)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_web
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,destack.gisc.tech}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://destack.gisc.tech}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - destack_network

  # Frontend React (Nginx serving built files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: destack_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - destack_network

  # EGS XML Collector - Robot para coleta automatica de XMLs
  scraper:
    # Google Chrome só tem build amd64; em hosts arm64 (Apple Silicon) roda via emulação.
    platform: linux/amd64
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: destack_scraper
    restart: unless-stopped
    environment:
      # EGS Sistemas
      - EGS_BASE_URL=https://app.egssistemas.com.br
      - EGS_LOGIN_URL=https://app.egssistemas.com.br/login
      - EGS_USERNAME=${EGS_USERNAME:-DESTACK}
      - EGS_PASSWORD=${EGS_PASSWORD:?defina EGS_PASSWORD no .env}
      - EGS_ACCESS_KEY=${EGS_ACCESS_KEY:-57226}
      # Destack API (produção: destack_app na rede apps_backend)
      - DESTACK_API_URL=${DESTACK_API_URL:-http://destack:8000/api}
      - DESTACK_USERNAME=${DESTACK_USERNAME:-admin}
      - DESTACK_PASSWORD=${DESTACK_PASSWORD:-admin123}
      # Collector
      - COLLECT_INTERVAL_MINUTES=60
      - DAYS_LOOKBACK=7
      - LOG_LEVEL=INFO
      - SELENIUM_HEADLESS=true
    volumes:
      - scraper_data:/app/data
      - scraper_logs:/app/logs
    depends_on:
      - web
    networks:
      - destack_network
      - apps_backend

  # Celery Worker (para tarefas assincronas)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network

  # Celery Beat (agendador de tarefas)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destack_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgres://${POSTGRES_USER:-destack_user}:${POSTGRES_PASSWORD:-destack_prod_password}@postgres:5432/${POSTGRES_DB:-destack_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - destack_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  scraper_data:
    driver: local
  scraper_logs:
    driver: local

networks:
  destack_network:
    driver: bridge
  apps_backend:
    external: true
