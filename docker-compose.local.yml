version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: destack_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: destack_db
      POSTGRES_USER: destack_user
      POSTGRES_PASSWORD: destack_local_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./backups:/backups:ro # Backups disponíveis no container
    ports:
      - "5433:5432" # Porta diferente da produção
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U destack_user -d destack_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_local

  # Redis Cache
  # Ambiente local: Redis sem senha para simplificar o desenvolvimento.
  # Em produção utilize REDIS_PASSWORD conforme docker-compose.yml.
  redis:
    image: redis:7-alpine
    container_name: destack_redis_local
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_local:/data
    ports:
      - "6380:6379" # Porta diferente da produção
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - destack_local

  # Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: destack_web_local
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Aguardando PostgreSQL...' &&
        while ! nc -z postgres 5432; do sleep 1; done &&
        echo 'PostgreSQL disponível!' &&
        echo 'Aplicando migrações...' &&
        python manage.py migrate --noinput &&
        echo 'Criando superusuário se não existir...' &&
        python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.create_superuser('admin', 'admin@destack.local', 'admin123') if not User.objects.filter(username='admin').exists() else print('Superusuário já existe')\" &&
        echo 'Coletando arquivos estáticos...' &&
        python manage.py collectstatic --noinput &&
        echo 'Iniciando servidor de desenvolvimento...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env.local
    volumes:
      - .:/app # Código local montado (hot reload)
      - static_volume_local:/app/staticfiles_collected
      - media_volume_local:/app/media
    ports:
      - "8001:8000" # Acessível em http://localhost:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - destack_local
  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: destack_frontend_local
    restart: unless-stopped
    environment:
      # Sinaliza que o Vite está rodando dentro do Docker; o proxy aponta para o nginx.
      - DOCKER_ENV=1
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobrescrever node_modules
    ports:
      - "8002:8000" # Frontend acessível em http://localhost:8002
    depends_on:
      - web
    networks:
      - destack_local

  # Evolution API - Gateway de WhatsApp self-hosted
  evolution_api:
    image: atendai/evolution-api:v2.2.2
    container_name: destack_evolution_api_local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-destack-local-key-change-in-production}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=${EVOLUTION_DATABASE_PROVIDER:-sqlite}
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_URI:-file:./evolution-api.db}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_LOGS=true
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_api_data_local:/evolution/instances
      - evolution_api_db_local:/evolution/db
    networks:
      - destack_local
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: destack_celery_local
    restart: unless-stopped
    command: celery -A core worker -l info
    env_file:
      - .env.local
    volumes:
      - .:/app
      - ./backups:/app/backups
    depends_on:
      - redis
      - postgres
      - evolution_api
    networks:
      - destack_local

  # Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: destack_beat_local
    restart: unless-stopped
    command: celery -A core beat -l info
    env_file:
      - .env.local
    volumes:
      - .:/app
      - ./backups:/app/backups
    depends_on:
      - redis
      - postgres
      - celery_worker
    networks:
      - destack_local

  # EGS XML Collector - Robot para coleta automatica de XMLs
  scraper:
    # Google Chrome so tem build amd64; em hosts arm64 (Apple Silicon) roda via emulacao.
    platform: linux/amd64
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: destack_scraper_local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      # EGS Sistemas (credenciais via .env.local)
      - EGS_BASE_URL=https://app.egssistemas.com.br
      - EGS_LOGIN_URL=https://app.egssistemas.com.br/login
      # Destack API (credenciais via .env.local)
      - DESTACK_API_URL=http://web:8000/api
      # Collector
      - COLLECT_INTERVAL_MINUTES=60
      - DAYS_LOOKBACK=7
      - LOG_LEVEL=INFO
      - SELENIUM_HEADLESS=true
    volumes:
      - scraper_data_local:/app/data
      - scraper_logs_local:/app/logs
    depends_on:
      - web
    networks:
      - destack_local

  # Nginx - gerenciador de midias e gateway unificado para desenvolvimento
  nginx:
    image: nginx:alpine
    container_name: destack_nginx_local
    restart: unless-stopped
    ports:
      - "8003:80" # Acessivel em http://localhost:8003
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - media_volume_local:/app/mediafiles:ro
    depends_on:
      - web
      - frontend
    networks:
      - destack_local

volumes:
  postgres_data_local:
    driver: local
  redis_data_local:
    driver: local
  static_volume_local:
    driver: local
  media_volume_local:
    driver: local
  scraper_data_local:
    driver: local
  scraper_logs_local:
    driver: local
  evolution_api_data_local:
    driver: local
  evolution_api_db_local:
    driver: local

networks:
  destack_local:
    driver: bridge
